<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- v2.11.30: usunięto maximum-scale=1.0 + user-scalable=no.
         Wcześniejsze ustawienie blokowało user'owi pinch-zoom co jest ANTI-A11Y
         (WCAG 2.1 SC 1.4.4 Resize Text wymaga 200% zoom). QA report PrimeTestLab
         wskazał że tekst za mały i user musi zoomować — więc nie można tego
         blokować. viewport-fit:cover daje support dla notch'y/safe-area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D77460" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spokojny Rodzic" />
    <meta name="description" content="Aplikacja, która pomaga Ci wiedzieć co robić, gdy dziecko jest chore." />
    <title>Spokojny Rodzic</title>
    <link rel="manifest" href="/babylog/manifest.json" />
    <link rel="apple-touch-icon" href="/babylog/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/babylog/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Capacitor v6/v8 bridge compatibility shim.

      Problem: Capacitor v6 native Android wstrzykuje window.androidBridge przez
      addJavascriptInterface (dostępne PRZED jakimkolwiek JS). Jednak gdy server.url
      używa addWebMessageListener z pełnym URL jako origin rule (np.
      "https://host/path/"), WebView może nie wstrzyknąć obiektu androidBridge dla tej
      strony (addWebMessageListener wymaga formatu "scheme://host" bez ścieżki).

      Fix: wykrywamy androidBridge TUTAJ (przed bundlem React) i ustawiamy
      window.CapacitorCustomPlatform = { name: 'android' }, który @capacitor/core v8
      odczytuje przy inicjalizacji modułu i zapisuje w domknięciu.
      Bez tego shima i bez useLegacyBridge, isNativePlatform() może zwrócić false.

      Ten skrypt MUSI być przed <script type="module">.
    -->
    <script>
      (function() {
        try {
          // Capacitor v6 native Android wstrzykuje window.androidBridge przez
          // addJavascriptInterface() PRZED załadowaniem jakichkolwiek skryptów strony.
          // @capacitor/core v8 sprawdza window.androidBridge przy inicjalizacji modułu.
          // Ustawienie CapacitorCustomPlatform tutaj gwarantuje że isNativePlatform()
          // działa nawet gdy addWebMessageListener nie wstrzyknie obiektu dla tego origin.
          if (typeof window.androidBridge !== 'undefined') {
            window.CapacitorCustomPlatform = { name: 'android' };
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- v2.10.6: SW registration moved to src/hooks/useServiceWorker.js (single source
         of truth — adds Sentry breadcrumbs + captureError on failure). Removing the
         inline registration here eliminates the duplicate register-on-load race. -->
  </body>
</html>
