name: Deploy BabyLog to Firebase Hosting

# v2.11.22: Migrated from GitHub Pages → Firebase Hosting.
# Reason: Repository was made private to protect signing keystore.
# GitHub Pages requires Pro plan ($4/mo) for private repos. Firebase
# Hosting is free for our usage tier (10GB transfer/mo) and integrates
# natively with the rest of our stack (Firestore, Auth, Functions, App Check).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          # Secrets ustawione w GitHub → Settings → Secrets and variables → Actions
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_RC_PUBLIC_KEY: ${{ secrets.VITE_RC_PUBLIC_KEY }}
          VITE_RC_ENTITLEMENT: ${{ secrets.VITE_RC_ENTITLEMENT }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BABYLOG }}
          channelId: live
          projectId: babylog-3c1cc
